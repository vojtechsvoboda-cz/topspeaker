<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03050d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%230c1844'/%3E%3Cg fill='%237cc8ff'%3E%3Crect x='14.5' y='44.5' width='5' height='11' rx='2.5'/%3E%3Crect x='22.75' y='39.5' width='5' height='21' rx='2.5'/%3E%3Crect x='31' y='27' width='5' height='46' rx='2.5'/%3E%3Crect x='39.25' y='15' width='5' height='70' rx='2.5'/%3E%3Crect x='47.5' y='38.5' width='5' height='23' rx='2.5'/%3E%3Crect x='55.75' y='44.5' width='5' height='11' rx='2.5'/%3E%3Crect x='64' y='32.5' width='5' height='35' rx='2.5'/%3E%3Crect x='72.25' y='41.5' width='5' height='17' rx='2.5'/%3E%3Crect x='80.5' y='46' width='5' height='8' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TOP Speaker App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Michroma&display=swap">
<style>
/* Layout: rozcestník → appka (mobil: horní lišta + tab bar, desktop: menu vlevo) · 5 textových stylů: display, title, body, body-strong, caption */
:root{
  --bg:#03050d;
  --surface:rgba(110,150,255,.045);
  --surface-2:rgba(110,150,255,.085);
  --surface-3:rgba(110,150,255,.14);
  --line:rgba(140,180,255,.11);
  --line-2:rgba(140,180,255,.2);
  --fg:#f2f5fc;
  --muted:#8fb0f0;
  --faint:#56689a;
  --accent:#4f8cff;
  --accent-hi:#8ab4ff;
  --ok:#5fe0ab;
  --pc:#4f8cff;
  --paper:#f7f8fb;--ink:#121726;--ink-2:#6a7286;--ink-line:#e0e4ec;
  --fd:"Michroma","Geist",sans-serif;
  --f:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:20px;--r-s:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 50% -260px,rgba(40,90,230,.32),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:12px}
p,h1,h2,h3{margin:0}

/* 5 text styles */
.t-display{font-family:var(--fd);font-size:24px;line-height:1.3;font-weight:400;letter-spacing:.01em;text-wrap:balance;background:linear-gradient(180deg,#f2f7ff 0%,#a9c8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-display.xl{font-size:clamp(44px,9vw,76px);letter-spacing:-.05em;line-height:1}
.t-title{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.t-strong{font-weight:500;letter-spacing:-.01em}
.t-cap{font-size:13px;line-height:1.45;color:var(--muted)}
.muted{color:var(--muted)}

/* surfaces & controls */
.card{background:linear-gradient(180deg,rgba(90,140,255,.07),rgba(255,255,255,.02) 50%);border:1px solid rgba(140,180,255,.13);border-radius:var(--r);padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-l{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:15px;transition:transform .15s,background .2s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(180deg,#5c97ff,#2f63f0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 28px -8px rgba(47,99,240,.9)}
.btn-primary:hover{background:linear-gradient(180deg,#6ea4ff,#3a6ef5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 36px -6px rgba(47,99,240,1)}
.btn-ghost{background:var(--surface-2);border-color:var(--line)}
.btn-ghost:hover{background:rgba(79,140,255,.16);border-color:rgba(140,180,255,.3)}
.btn[disabled]{opacity:.3;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;flex:none}
.icon-btn svg{width:19px;height:19px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill svg{width:13px;height:13px}
.pill.ok{background:rgba(95,224,171,.12);color:var(--ok)}
.pill.blue{background:rgba(79,140,255,.16);color:var(--accent-hi)}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#e6efff;flex:none;position:relative;background:radial-gradient(110% 90% at 50% 120%,rgba(90,150,255,.55),rgba(30,70,200,.35) 45%,rgba(12,26,90,.6) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(160,200,255,.18),0 4px 16px -6px rgba(47,99,240,.7)}
.tile svg{filter:drop-shadow(0 0 4px rgba(140,190,255,.8))}
.tile svg{width:20px;height:20px}
.view{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Generic page (hub, list, lektor) ===== */
.page{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 64px}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,#2b5fe0,#0e1f57);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;cursor:pointer;color:var(--muted);font-weight:500}
.back:hover{color:var(--fg)}
.back svg{width:18px;height:18px}

/* hub */
.hub-hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-block:8px 8px}
.ribbons{width:100%;height:170px;display:block}
.hub-hero .t-cap{max-width:52ch;font-size:16px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.flow div{padding:16px 18px;display:flex;gap:12px;align-items:center;border-left:1px solid var(--line);min-width:0}
.flow div:first-child{border-left:0}
.flow svg{width:20px;height:20px;color:var(--accent-hi);flex:none}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door{display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;padding:22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:background .2s,border-color .2s,transform .2s;min-width:0}

.door .preview{height:150px;border-radius:14px;background:radial-gradient(240px 140px at 50% 0%,rgba(60,110,255,.35),transparent 75%),#070c1c;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.door .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-hi)}
.door .go svg{width:16px;height:16px}
.credit{display:flex;justify-content:center;padding-top:8px}
.credit a{text-decoration:none;color:var(--fg)}
.credit a:hover{color:var(--accent-hi)}
.credit .sel{user-select:all}
/* mini previews */
.mini-phone{width:84px;height:136px;border-radius:18px;border:1.5px solid var(--line-2);background:#060a18;padding:12px 9px;display:flex;flex-direction:column;gap:6px}
.mini-phone i{display:block;height:6px;border-radius:4px;background:var(--surface-3)}
.mini-phone i.a{background:var(--accent);width:60%}
.mini-phone .h{height:44px;border-radius:8px;background:radial-gradient(circle at 50% 50%,rgba(80,140,255,.6),transparent 70%)}
.mini-paper{width:96px;height:132px;background:var(--paper);border-radius:4px;padding:12px 10px;display:flex;flex-direction:column;gap:7px;transform:rotate(-3deg);box-shadow:0 14px 30px -10px rgba(0,0,0,.7)}
.mini-paper i{display:block;height:4px;border-radius:2px;background:#cfd5e2}
.mini-paper i.a{background:var(--ink);width:70%;height:6px}
.mini-dash{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:150px}
.mini-dash i{display:block;height:38px;border-radius:8px;background:var(--surface-3)}
.mini-dash i.w{grid-column:span 2;height:30px;background:linear-gradient(90deg,var(--accent) 64%,var(--surface-3) 64%)}

/* ===== App shell ===== */
.shell{min-height:100%}
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,5,13,.82);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#03050d}
.mbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbar-title{font-weight:600;font-size:15px;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.content{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(6,9,20,.86);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .navl{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;cursor:pointer;color:var(--faint);font-size:11px;font-weight:500;border-radius:12px;transition:color .15s}
.nav-i svg{width:23px;height:23px}
.nav-i.active{color:var(--fg)}
.nav-i.active svg{color:var(--accent-hi)}
.side{display:none}
@media (min-width:960px){
  .mbar,.tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;inset:0 auto 0 0;width:260px;padding:24px 16px calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:rgba(5,8,18,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:20}
  .side .brand{padding:0 8px 22px}
  .side .nav-i{flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;color:var(--muted);justify-content:flex-start}
  .side .nav-i svg{width:20px;height:20px}
  .side .nav-i:hover{background:var(--surface);color:var(--fg)}
  .side .nav-i.active{background:var(--surface-2);color:var(--fg)}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 8px}
  .shell .content{margin-left:260px;margin-right:0;max-width:none;padding-left:clamp(32px,5vw,72px);padding-right:clamp(32px,5vw,72px);padding-block:40px 64px}
  .shell .content>*{max-width:880px}
}

/* ===== Options (diagnostika + cvičení) ===== */
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:grid;grid-template-columns:40px 1fr 22px;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;transition:background .18s,border-color .18s;min-width:0}
.opt:hover{background:rgba(79,140,255,.09);border-color:rgba(140,180,255,.25)}
.opt .tile{transition:background .18s,color .18s}
.opt .ind{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .18s}
.opt .ind.radio{border-radius:50%}
.opt .ind svg{width:14px;height:14px}
.opt.sel{background:rgba(79,140,255,.1);border-color:rgba(110,160,255,.55)}
.opt.sel .tile{background:radial-gradient(110% 90% at 50% 120%,#7fb0ff,#2f63f0 60%,#1a3fb8);color:#fff}
.opt.sel .ind{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .tx{min-width:0}

/* diag */
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.prog span{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog span b{display:block;height:100%;width:0;background:var(--accent-hi);transition:width .45s cubic-bezier(.3,.7,.2,1)}
.prog span.on b{width:100%}
.q-nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.step-body{animation:in .35s cubic-bezier(.2,.7,.2,1) both}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);color:var(--fg);font:inherit;padding:12px 14px;resize:vertical;min-height:80px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
textarea::placeholder{color:var(--faint)}
.addnote{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--accent-hi);font-weight:500;cursor:pointer}
.addnote svg{width:16px;height:16px}

/* hexagon editor */
.hexstep{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:760px){.hexstep{grid-template-columns:300px 1fr;gap:32px}}
.hexwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.hex{width:100%;max-width:280px;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}
.hex text{font:500 11.5px var(--f);fill:var(--muted)}
.hex .hd{cursor:grab}
.hex.dragging .hd{cursor:grabbing}
.hex polygon.shape{transition:fill .5s,stroke .5s}
.hex.live polygon.shape{transition:points .12s,fill .5s,stroke .5s}
.persona-live{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:14px;transition:background .4s}
.persona-live i{width:18px;height:18px;border-radius:50%;background:var(--pc);box-shadow:0 0 14px var(--pc);transition:background .4s,box-shadow .4s}
.rates{display:flex;flex-direction:column}
.rate{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.rate:first-child{border-top:0}
.rate>svg{width:20px;height:20px;color:var(--muted)}
.rate .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dots{display:flex;gap:4px}
.dot{width:32px;height:32px;border-radius:10px;border:0;background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.dot:hover{background:var(--surface-3);color:var(--fg)}
.dot.fill{background:rgba(79,140,255,.28);color:var(--fg)}
.dot.on{background:var(--pc);color:#050a18}

/* persona card */
.persona{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;border:1px solid var(--line);background:
  radial-gradient(420px 220px at 100% 0%,color-mix(in srgb,var(--pc) 32%,transparent),transparent 70%),var(--surface)}
.persona .orb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--pc) 45%,color-mix(in srgb,var(--pc) 30%,#000) 100%);box-shadow:0 0 40px color-mix(in srgb,var(--pc) 70%,transparent);flex:none}
.persona-grid{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media (min-width:700px){.persona-grid{grid-template-columns:260px 1fr}}

.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ladder div{font-size:13px;color:var(--faint);padding-top:8px;border-top:3px solid var(--surface-3);font-weight:500}
.ladder div.on{color:var(--fg);border-color:var(--accent-hi)}

/* list rows */
.lrows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow.static{cursor:default}
.lrow .chev{color:var(--faint);width:18px;height:18px}
button.lrow:hover .tile{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(160,200,255,.3),0 6px 22px -4px rgba(47,99,240,1)}
.info{display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;padding-block:13px;border-top:1px solid var(--line)}
.info:first-child{border-top:0;padding-top:4px}
.info>svg{width:20px;height:20px;color:var(--accent-hi);margin-top:1px}

/* course */
.chap-st{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.play-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.play-ic svg{width:14px;height:14px;margin-left:2px}
.prio-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-hi);margin-right:6px;vertical-align:middle}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent-hi);border-radius:6px;transition:width .6s}

/* video */
.video{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:radial-gradient(500px 260px at 50% 110%,rgba(40,90,230,.45),transparent 70%),#050a1a;cursor:pointer;padding:0}
.video canvas{position:absolute;inset:0;width:100%;height:100%}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:12px 22px 12px 14px;border-radius:99px;background:rgba(255,255,255,.95);color:#060a18;font-weight:600;box-shadow:0 10px 40px rgba(40,90,230,.5);transition:transform .2s}
.video:hover .play{transform:translate(-50%,-50%) scale(1.04)}
.video .play span.c{width:34px;height:34px;border-radius:50%;background:#060a18;color:#fff;display:grid;place-items:center}
.video .play svg{width:14px;height:14px;margin-left:2px}
.video .vbar{position:absolute;left:16px;right:16px;bottom:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.video .vbar b{display:block;height:100%;width:0;background:#fff}
.video .vnote{position:absolute;left:16px;bottom:28px;font-size:13px;color:rgba(255,255,255,.8)}
.vstatus{display:flex;justify-content:space-between;align-items:center;gap:10px}

.stat{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.stat .num{font-size:52px;font-weight:600;letter-spacing:-.05em;line-height:1;background:linear-gradient(180deg,#fff 30%,var(--accent-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.cmp{display:grid;gap:8px}
.cmp>div{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:14px;border-radius:var(--r-s);border:1px solid var(--line)}
.cmp>div svg{width:20px;height:20px}
.cmp .bad{color:var(--muted)}
.cmp .good{background:rgba(79,140,255,.1);border-color:rgba(110,160,255,.45)}
.cmp .good svg{color:var(--accent-hi)}
.para{display:flex;flex-direction:column;gap:12px}
.para-i{display:grid;grid-template-columns:40px 1fr;gap:14px}
.para-i .tile{font-weight:600;font-size:17px}
.para-i textarea{min-height:56px;margin-top:6px}
.chap-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chap-nav button{padding:14px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px}
.chap-nav button:hover{background:rgba(79,140,255,.1);border-color:rgba(140,180,255,.3)}
.chap-nav button.r{text-align:right;align-items:flex-end}
.chap-nav .t-strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* dashboard */
.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .wide{grid-column:span 2}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:16px;border-radius:var(--r-s);background:linear-gradient(180deg,rgba(90,140,255,.08),rgba(255,255,255,.02));border:1px solid rgba(140,180,255,.13);min-width:0}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:12px;align-items:center;padding-block:8px}
.hbar>svg{width:18px;height:18px;color:var(--muted)}
.hbar .tr{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.hbar .tr b{display:block;height:100%;background:var(--accent);border-radius:8px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) 56px;gap:14px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#06102a;background:linear-gradient(160deg,#b6d0ff,#4f8cff);box-shadow:0 0 18px -4px rgba(79,140,255,.8)}
.mini-hex{width:56px;height:56px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{padding:16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* paper */
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:32px 28px 24px;max-width:600px;margin:0 auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.9);display:flex;flex-direction:column;gap:24px}
.paper .t-cap{color:var(--ink-2)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-sec{display:flex;flex-direction:column;gap:6px}
.p-lines{display:flex;flex-direction:column;gap:24px;padding-top:14px}
.p-lines span{border-bottom:1px solid var(--ink-line)}
.p-axis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.p-axis div{border:1px solid var(--ink-line);border-radius:8px;padding:10px 10px 40px;min-width:0}
.p-rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;margin-top:6px}
.p-dots{display:flex;gap:8px}
.p-dots span{width:24px;height:24px;border-radius:50%;border:1.5px solid #c6ccda;display:grid;place-items:center;font-size:11px;color:var(--ink-2)}
.p-foot{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center;border-top:1px solid var(--ink-line);padding-top:18px}

/* ===== TS glass icon ===== */
.tsi{position:relative;width:1em;height:1em;font-size:var(--s,32px);flex:none;display:inline-block}
.tsi-halo{position:absolute;inset:-.45em;border-radius:50%;background:radial-gradient(closest-side,rgba(50,110,255,.55),rgba(50,110,255,.12) 60%,transparent);pointer-events:none}
.tsi.sm .tsi-halo{inset:-.2em;opacity:.6}
.tsi-tile{position:absolute;inset:0;border-radius:.27em;overflow:hidden;
  background:radial-gradient(110% 90% at 50% 115%,rgba(90,150,255,.9) 0%,rgba(30,80,230,.75) 40%,rgba(10,30,120,.85) 75%,rgba(6,16,70,.95) 100%);
  box-shadow:inset 0 .006em 0 .004em rgba(255,255,255,.75),inset 0 0 0 .006em rgba(255,255,255,.22),inset 0 -.09em .18em rgba(0,8,50,.7),inset 0 .1em .16em rgba(170,205,255,.4),0 .12em .32em -.06em rgba(30,90,255,.9),0 0 .55em rgba(40,100,255,.45)}
.tsi-tile::before{content:"";position:absolute;left:-10%;right:-10%;top:-38%;height:62%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));transform:rotate(-8deg)}
.tsi-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:.012em;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.05) 35%,rgba(120,170,255,.1) 70%,rgba(160,200,255,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tsi svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tsi text{font-family:var(--f);font-weight:600;letter-spacing:-.06em}
.hero-icon{--s:clamp(150px,30vw,210px);position:relative;display:grid;place-items:center;padding-top:28px;perspective:900px}
.hero-icon .beam{position:absolute;left:50%;top:-60px;width:2px;height:calc(100% + 40px);transform:translateX(-50%);background:linear-gradient(180deg,rgba(140,190,255,0),rgba(140,190,255,.9) 45%,rgba(140,190,255,0) 80%);box-shadow:0 0 30px 8px rgba(60,120,255,.45);pointer-events:none}
.hero-icon .floor{position:absolute;left:50%;bottom:-26px;width:calc(var(--s)*1.6);height:40px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(60,120,255,.55),transparent);filter:blur(10px)}
.hero-icon .tilt{display:block;position:relative;transition:transform .25s ease-out;transform-style:preserve-3d;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}
.hero-icon .rib{position:absolute;left:-20%;right:-20%;top:50%;height:150px;transform:translateY(-35%);width:140%;opacity:.7;pointer-events:none}
.wordmark{font-size:clamp(46px,9.5vw,84px);line-height:1;font-weight:500;letter-spacing:-.055em;background:linear-gradient(180deg,#ffffff 0%,#dbe6ff 45%,#8ea3d6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.wordmark b{font-weight:600}
.pin-credit{text-align:center;font-size:11px;opacity:.22;transition:opacity .2s;padding-top:48px}
.pin-credit a{text-decoration:none}
.pin-credit:hover,.pin-credit:focus-within{opacity:1}
.print-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:-.04em}

/* hero art + wordmark */
.hero-art{position:relative;width:min(100%,560px);display:grid;place-items:center;margin-bottom:-36px}
.hero-art::before{content:"";position:absolute;left:50%;top:44%;width:min(90vw,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(47,99,240,.38),rgba(47,99,240,.12) 55%,transparent);pointer-events:none}
.hero-img{position:relative;width:min(78vw,420px);height:auto;display:block;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%);animation:float 12s ease-in-out infinite}
.hero-art .rib{position:absolute;left:50%;width:100vw;top:30%;height:170px;transform:translateX(-50%);opacity:.9;mix-blend-mode:screen}
.wordmark{font-family:"Michroma","Geist",sans-serif;font-weight:400;font-size:clamp(28px,6vw,54px);letter-spacing:.06em;line-height:1.1;position:relative;
  background:linear-gradient(180deg,#e9f1ff 0%,#8fb8ff 45%,#3d74ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 0 transparent}
.wordmark::after{content:attr(data-t)}
.hub-hero .t-cap{margin-top:-4px}
/* glass doors */
.doors{gap:16px}
.door{position:relative;overflow:hidden;isolation:isolate;align-items:center;text-align:center;background:linear-gradient(180deg,rgba(70,120,255,.10),rgba(70,120,255,.02) 40%);border:1px solid rgba(140,180,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:border-color .3s,box-shadow .3s}
.door::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,30%),rgba(79,140,255,.22),transparent 60%)}
.door:hover::before{opacity:1}
.door:hover{border-color:rgba(140,180,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 60px -24px rgba(47,99,240,.6)}
.door .t-cap{max-width:34ch}
.door .preview{width:100%;height:210px;background:radial-gradient(260px 160px at 50% 100%,rgba(47,99,240,.45),transparent 75%),rgba(4,8,22,.6);border-color:rgba(140,180,255,.12)}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--accent-hi);padding:5px 12px;border-radius:99px;background:rgba(79,140,255,.12);border:1px solid rgba(110,160,255,.25)}
.phase svg{width:14px;height:14px}
.pv-phone{width:118px;height:196px;margin-top:22px;border-radius:22px 22px 0 0;border:1.5px solid rgba(160,195,255,.28);border-bottom:0;background:linear-gradient(180deg,#0a1230,#060a1c);padding:10px 10px 0;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 0 40px -6px rgba(47,99,240,.6)}
.pv-top{display:flex;gap:5px;align-items:center;width:100%}
.pv-dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(180deg,#5c97ff,#2f63f0);box-shadow:0 0 8px #2f63f0}
.pv-l{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.18);width:100%}
.pv-hex{width:84px;height:auto}
.pv-pill{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:600;padding:3px 7px;border-radius:99px;background:rgba(79,140,255,.18);color:#cfe0ff}
.pv-pill i{width:6px;height:6px;border-radius:50%;background:#7fb0ff;box-shadow:0 0 6px #7fb0ff}
.pv-row{display:flex;gap:5px;align-items:center;width:100%}
.pv-row b{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.1);flex:none}
.pv-btn{margin-top:2px;font-size:8px;font-weight:600;color:#fff;padding:5px 14px;border-radius:99px;background:linear-gradient(180deg,#5c97ff,#2f63f0);box-shadow:0 4px 12px -2px #2f63f0}
.pv-paper{width:140px;height:178px;background:#f7f8fb;border-radius:4px;padding:12px;transform:rotate(-3deg);box-shadow:0 20px 40px -12px rgba(0,0,0,.8),0 0 50px -10px rgba(47,99,240,.6);color:#121726;text-align:left;display:flex;flex-direction:column;gap:5px}
.pv-ph{display:flex;align-items:center;gap:4px;font-size:6.5px;font-weight:600;margin-bottom:3px}
.pv-mk{width:8px;height:8px;border-radius:2px;background:#121726}
.pv-paper p{font-size:7px;font-weight:600;display:flex;gap:4px}
.pv-paper p b{color:#2f63f0}
.pv-paper>i{display:block;height:1px;background:#d9dee8;margin:3px 0 2px}
.pv-axis{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pv-axis span{height:16px;border:1px solid #d9dee8;border-radius:3px}
.pv-circ{display:flex;gap:4px}
.pv-circ span{width:9px;height:9px;border-radius:50%;border:1px solid #c6ccda}
.pv-circ span:nth-child(4){background:#2f63f0;border-color:#2f63f0}
.pv-dash{width:180px;padding:12px;border-radius:14px;background:rgba(10,18,48,.85);border:1px solid rgba(140,180,255,.2);box-shadow:0 0 50px -10px rgba(47,99,240,.7);display:flex;flex-direction:column;gap:8px;text-align:left}
.pv-kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pv-kpi span{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);font-size:14px;font-weight:600;letter-spacing:-.02em}
.pv-kpi small{display:block;font-size:7px;font-weight:500;color:var(--muted);letter-spacing:0}
.pv-cap{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.pv-cap b{display:block;height:100%;border-radius:4px;background:#5c97ff;box-shadow:0 0 8px #2f63f0}
.pv-chart{display:flex;align-items:flex-end;gap:5px;height:44px}
.pv-chart i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#7fb0ff,rgba(47,99,240,.35))}
.pv-av{display:flex}
.pv-av span{width:18px;height:18px;border-radius:50%;margin-left:-4px;display:grid;place-items:center;font-size:8px;font-weight:600;color:#06102a;background:linear-gradient(160deg,#a9c8ff,#4f8cff);border:1.5px solid #0a1230}
.pv-av span:first-child{margin-left:0}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:40;background:var(--fg);color:#060a18;font-weight:600;font-size:14px;padding:11px 18px;border-radius:99px;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:32px}}

@media (max-width:720px){
  .doors{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow div{border-left:0;border-top:1px solid var(--line)}
  .flow div:first-child{border-top:0}
}
@media (max-width:440px){
  .t-display{font-size:20px}
  .dot{width:29px;height:29px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis .kpi:last-child{grid-column:span 2}
  .groups{grid-template-columns:1fr}
  .p-axis{grid-template-columns:1fr}
  .p-axis div{padding-bottom:24px}
  .paper{padding:24px 18px 20px}
  .stat .num{font-size:42px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== v7 refinements ===== */
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.tsi-halo{opacity:.45;inset:-.6em}
.tsi.sm .tsi-halo{inset:-.25em;opacity:.35}
.tile{background:linear-gradient(180deg,rgba(110,150,255,.16),rgba(110,150,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(150,190,255,.14)}
.tile svg{filter:none;color:#cfe0ff}
button.lrow:hover .tile{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(150,190,255,.3)}
.opt.sel .tile svg{color:#fff}

.hero-art{margin-bottom:-24px}

.hero-img{width:auto;height:clamp(190px,30vh,300px)}
.wordmark{font-size:clamp(26px,4.6vw,46px)}
.doors{margin-top:auto}
.door{padding:18px;gap:12px}
.door .preview{height:170px}
.door::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,30%),rgba(79,140,255,.12),transparent 60%)}
.door:hover{border-color:rgba(140,180,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 14px 40px -28px rgba(47,99,240,.55)}
.pin-credit{padding:8px 0 16px}
.pv-phone{width:112px;height:176px;margin-top:26px;border-radius:18px 18px 0 0}
.pv-paper{transform:rotate(-2deg) translateY(18px);width:128px;height:166px}
.pv-win{width:196px;padding:12px 12px 10px;border-radius:12px;background:linear-gradient(180deg,rgba(16,26,62,.95),rgba(8,14,36,.95));border:1px solid rgba(140,180,255,.18);box-shadow:0 0 40px -14px rgba(47,99,240,.7);text-align:left;display:flex;flex-direction:column;gap:7px}
.pv-wh{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted)}

.pv-badge{font-size:8px;font-weight:600;color:#cfe0ff;background:rgba(79,140,255,.18);padding:2px 6px;border-radius:99px}

.pv-spark{width:100%;height:36px;display:block}
.pv-rows{display:flex;flex-direction:column;border-top:1px solid rgba(140,180,255,.12)}
.pv-r{display:grid;grid-template-columns:14px 1fr auto auto;gap:6px;align-items:center;font-size:8px;padding-top:6px}
.pv-a{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:7px;font-weight:600;color:#06102a;background:linear-gradient(160deg,#b6d0ff,#4f8cff)}
.pv-n{color:var(--fg);font-weight:500}
.pv-p{color:var(--muted)}
.pv-lv{color:var(--faint)}
/* gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px}

.gate-wm{font-size:24px}

.chap{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px}
.chap.is-done .t-strong{color:var(--accent-hi)}
.ch-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-prog{height:3px;border-radius:3px;background:var(--surface-3);margin-top:6px;max-width:220px;overflow:hidden}
.mini-prog b{display:block;height:100%;background:var(--accent-hi)}
.ch-st .play-ic{background:rgba(79,140,255,.16);color:var(--accent-hi)}
.cov .tsi-halo{opacity:.3}
.cov-ic{position:absolute;inset:0;display:grid;place-items:center}
.cov-ic svg{width:.44em;height:.44em;color:#eef4ff;stroke-width:1.5;filter:drop-shadow(0 0 .06em rgba(150,195,255,.95))}
.chap-grid{display:grid;grid-template-columns:1fr;gap:20px}
.chap-left{display:flex;flex-direction:column;gap:14px}
@media (min-width:1100px){
  .chap-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  .chap-left{position:sticky;top:24px}
}
.player{border-radius:var(--r);overflow:hidden;border:1px solid rgba(140,180,255,.16);background:#050a1a}
.player .video{border:0;border-radius:0;cursor:default}
.vcov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:opacity .3s}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,rgba(92,151,255,.9),rgba(47,99,240,.9));box-shadow:0 8px 30px -6px rgba(47,99,240,1),inset 0 1px 0 rgba(255,255,255,.4);opacity:0;transition:opacity .2s}
.bigplay svg{width:22px;height:22px;margin-left:3px}
.video:hover .bigplay,.bigplay:focus-visible{opacity:1}
.video:hover .vcov{opacity:.35}
.video.playing .bigplay{display:none}
.video.playing .vcov{opacity:.15}
.vnote{position:absolute;left:16px;bottom:14px;font-size:13px;color:rgba(230,238,255,.85)}
.vctrl{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid rgba(140,180,255,.1)}
.vtrack{height:6px;border-radius:6px;background:var(--surface-3);cursor:pointer;overflow:hidden}
.vtrack b{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#9cc2ff);border-radius:6px}
.vtime{font-variant-numeric:tabular-nums;white-space:nowrap}
.done-btn{color:var(--accent-hi);border-color:rgba(140,180,255,.3)}
.nextch{display:grid;grid-template-columns:48px minmax(0,1fr) 18px;gap:14px;align-items:center;padding:14px 16px}
.nextch .chev{width:18px;height:18px;color:var(--faint)}
/* persona */
.persona{background:radial-gradient(420px 220px at 100% 0%,var(--pca,rgba(79,140,255,.3)),transparent 70%),linear-gradient(180deg,rgba(90,140,255,.07),rgba(90,140,255,.02))}
.persona .orb{background:radial-gradient(circle at 35% 30%,#fff 0,var(--pc) 45%,#071440 100%);box-shadow:0 0 30px -4px var(--pc)}
.persona.is-top{border-color:rgba(140,180,255,.4)}
.persona.is-top::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;padding:1px;background:linear-gradient(110deg,transparent 30%,rgba(170,205,255,.9) 50%,transparent 70%) 0 0/250% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sheen 4s linear infinite}
.persona.is-top .orb{animation:pulse 3s ease-in-out infinite}
@keyframes sheen{to{background-position:-250% 0}}
@keyframes pulse{50%{box-shadow:0 0 46px 2px var(--pc)}}
.tier{display:flex;gap:4px;margin-top:16px}
.tier i{flex:1;height:4px;border-radius:4px;background:var(--surface-3)}
.tier i.on{background:var(--c)}

.tsi .cov-ic svg{position:static;inset:auto;width:.44em;height:.44em;overflow:visible}

/* v8: modern iOS-style tile, top light beam */
.tsi-halo{opacity:.22!important;inset:-.35em!important}
.tsi.sm .tsi-halo{opacity:.18!important;inset:-.15em!important}
.tsi-tile{box-shadow:inset 0 .006em 0 .002em rgba(255,255,255,.22),inset 0 0 0 .005em rgba(170,205,255,.12),inset 0 -.08em .16em rgba(0,8,50,.55),inset 0 .08em .14em rgba(150,190,255,.18),0 .08em .22em -.06em rgba(30,90,255,.55)!important}
.tsi-tile::before{opacity:.35}
.tsi-tile::after{opacity:.35}
.beam-wrap{position:absolute;left:50%;top:0;width:min(900px,100vw);height:72%;transform:translateX(-50%);pointer-events:none;z-index:0;overflow:hidden}
.beam-wrap i{position:absolute;left:50%;top:0;transform:translateX(-50%);display:block}
.beam-wrap .b1{width:70%;height:100%;background:radial-gradient(50% 100% at 50% 0%,rgba(40,95,255,.30),rgba(40,95,255,.10) 45%,transparent 75%)}
.beam-wrap .b2{width:26%;height:100%;background:linear-gradient(180deg,rgba(70,130,255,.0),rgba(70,130,255,.28) 35%,rgba(70,130,255,.12) 80%,transparent);filter:blur(18px);-webkit-mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)}
.beam-wrap .b3{width:7%;height:96%;background:linear-gradient(180deg,rgba(150,195,255,.15),rgba(140,190,255,.6) 50%,rgba(140,190,255,.15) 90%,transparent);filter:blur(10px)}
.beam-wrap .b4{width:2px;height:92%;background:linear-gradient(180deg,rgba(200,225,255,0),rgba(200,225,255,.9) 55%,rgba(200,225,255,0));filter:blur(.6px)}
.beam-wrap .b5{width:40%;height:100%;opacity:.5;background-image:radial-gradient(1px 1px at 20% 30%,rgba(190,215,255,.8),transparent),radial-gradient(1px 1px at 70% 55%,rgba(190,215,255,.7),transparent),radial-gradient(1.5px 1.5px at 45% 70%,rgba(190,215,255,.6),transparent),radial-gradient(1px 1px at 60% 18%,rgba(190,215,255,.7),transparent),radial-gradient(1px 1px at 35% 85%,rgba(190,215,255,.5),transparent),radial-gradient(1px 1px at 82% 40%,rgba(190,215,255,.5),transparent);animation:drift 14s linear infinite;-webkit-mask:radial-gradient(40% 60% at 50% 50%,#000,transparent);mask:radial-gradient(40% 60% at 50% 50%,#000,transparent)}
@keyframes drift{from{background-position:0 0}to{background-position:0 60px}}
.hub{position:relative}
.hub>*{position:relative;z-index:1}
.hub>.beam-wrap{position:absolute;z-index:0}
.gate{position:relative;overflow:hidden}
.gate .beam-wrap{height:62%}
.gate-box{position:relative;z-index:1}
.hero-art::before{opacity:.6}

/* beam v2: from top, ends at the icon */
.beam-wrap{top:auto!important;bottom:76%;height:62vh;width:640px;max-width:100vw}
.gate-icon{position:relative}
.gate-icon .beam-wrap{bottom:62%;height:56vh;width:560px}
.gate .beam-wrap{height:56vh}
.beam-wrap .b1{width:80%;background:radial-gradient(50% 100% at 50% 100%,rgba(40,95,255,.26),rgba(40,95,255,.07) 50%,transparent 80%)}
.beam-wrap .b2{width:30%;background:linear-gradient(180deg,transparent,rgba(70,130,255,.08) 40%,rgba(70,130,255,.3))}
.beam-wrap .b3{width:8%;height:100%;background:linear-gradient(180deg,transparent,rgba(140,190,255,.18) 40%,rgba(160,205,255,.55));filter:blur(9px)}
.beam-wrap .b4{height:100%;opacity:.55;background:linear-gradient(180deg,transparent,rgba(210,230,255,.4) 50%,rgba(220,235,255,.9))}
.beam-wrap .b5{-webkit-mask:linear-gradient(180deg,transparent,#000 60%);mask:linear-gradient(180deg,transparent,#000 60%)}
.hero-img,.gate-icon .tsi{position:relative;z-index:1}
.hero-art .rib{z-index:0}

.beam-wrap{bottom:72%;-webkit-mask:linear-gradient(180deg,#000 50%,transparent 100%);mask:linear-gradient(180deg,#000 50%,transparent 100%)}
.gate-icon .beam-wrap{bottom:30%}

.beam-wrap{bottom:82%;-webkit-mask:linear-gradient(180deg,#000 82%,transparent 100%);mask:linear-gradient(180deg,#000 82%,transparent 100%)}
.gate-icon .beam-wrap{bottom:48%}
.beam-wrap .b2{background:linear-gradient(180deg,transparent,rgba(70,130,255,.12) 40%,rgba(70,130,255,.42))}
.beam-wrap .b3{background:linear-gradient(180deg,transparent,rgba(140,190,255,.22) 40%,rgba(170,210,255,.75))}
.beam-wrap .b1{background:radial-gradient(50% 100% at 50% 100%,rgba(40,95,255,.34),rgba(40,95,255,.08) 50%,transparent 80%)}
.hero-art .beam-wrap{bottom:77%}

/* v9 */
.hero-img{mix-blend-mode:screen;-webkit-mask-image:radial-gradient(52% 60% at 50% 42%,#000 60%,transparent 100%)!important;mask-image:radial-gradient(52% 60% at 50% 42%,#000 60%,transparent 100%)!important;height:clamp(220px,34vh,330px)}
.hero-art .rib{-webkit-mask:linear-gradient(90deg,#000 0,#000 28%,transparent 44%,transparent 56%,#000 72%,#000 100%);mask:linear-gradient(90deg,#000 0,#000 28%,transparent 44%,transparent 56%,#000 72%,#000 100%);top:18%}
.hero-art::before{opacity:.4}
.hub-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 0 14px}
.hub-foot .pin-credit{padding:0}
.logout{justify-self:start;background:none;border:0;padding:6px 0;font-size:12px;color:var(--faint);cursor:pointer}
.logout:hover{color:var(--muted)}
.gate-field{width:220px}
.gate-field input{width:220px}
.enter{position:relative;display:inline-flex;border-radius:99px;padding:1.5px;overflow:hidden;isolation:isolate;width:220px}
.enter::before{content:"";position:absolute;inset:-180%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 62%,rgba(160,205,255,.0) 66%,#b9d6ff 80%,transparent 92%);animation:spin 3.6s linear infinite}
.enter .btn{width:100%;box-shadow:0 8px 28px -10px rgba(47,99,240,.9);animation:breathe 3.6s ease-in-out infinite}
.enter:hover::before{animation-duration:1.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{box-shadow:0 10px 40px -6px rgba(47,99,240,1)}}
@media (max-width:440px){.gate-field .btn{width:100%}}
@media (min-width:1100px){.chap-left{position:sticky;top:40px;max-height:calc(100dvh - 80px);overflow:auto;scrollbar-width:none}.chap-left::-webkit-scrollbar{display:none}}
.pill.lock{background:rgba(110,150,255,.1);color:var(--muted)}
.unlock{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start}
.lockcard{border-style:dashed}

/* v10: no visible image edge, wordmark fits */
.hero-img{-webkit-mask-image:radial-gradient(closest-side at 50% 46%,#000 62%,transparent 100%)!important;mask-image:radial-gradient(closest-side at 50% 46%,#000 62%,transparent 100%)!important;max-width:92vw;object-fit:contain}
.wordmark{font-size:clamp(20px,7.2vw,46px);letter-spacing:.04em;white-space:nowrap;max-width:100%}
@media (max-width:440px){.hero-img{height:auto;width:min(78vw,300px)}.hero-art{margin-bottom:-18px}}

/* ===== v11: unified futuristic blue, matte modern icons ===== */
:root{--accent:#3b82ff;--accent-hi:#8cc8ff;--blue-grad:linear-gradient(135deg,#1f5cff 0%,#3d8bff 55%,#7cc8ff 100%)}
/* hero back to original PNG */
.hero-img{mix-blend-mode:normal!important;-webkit-mask-image:linear-gradient(180deg,#000 58%,transparent 100%)!important;mask-image:linear-gradient(180deg,#000 58%,transparent 100%)!important}
.hero-art .rib{-webkit-mask:none!important;mask:none!important;top:30%}
.hero-art::before{opacity:.55}
/* beams: strong on hub, subtle on login */
.hero-art .beam-wrap{bottom:74%;width:min(1000px,100vw);height:70vh;z-index:0}
.hero-art .beam-wrap .b1{width:90%}
.gate-icon .beam-wrap{width:420px;height:42vh;opacity:.55}
.gate-wm{font-size:22px!important;letter-spacing:.06em;white-space:nowrap;max-width:none;overflow:visible;text-align:center;padding-inline:.1em}
.gate-box{max-width:none}
/* logo tile: matte modern iOS */
.tsi-tile{background:linear-gradient(160deg,#16296a 0%,#0c1844 55%,#081030 100%)!important;box-shadow:inset 0 0 0 .008em rgba(130,170,255,.32),inset 0 .012em 0 rgba(180,210,255,.18),0 .1em .28em -.08em rgba(0,0,0,.7)!important}
.tsi-tile::before,.tsi-tile::after{display:none}
.tsi-halo{display:none}
.tsi svg rect{filter:none}
.hero-icon,.gate-icon .tsi{filter:drop-shadow(0 0 22px rgba(60,130,255,.35))}
.cov-ic svg{width:.56em!important;height:.56em!important;stroke-width:1.7;filter:none!important}
/* generic tiles match */
.tile{width:44px;height:44px;border-radius:13px;background:linear-gradient(160deg,#152763,#0a153e)!important;box-shadow:inset 0 0 0 1px rgba(130,170,255,.26),0 4px 12px -6px rgba(0,0,0,.6)!important;color:#8cc8ff}
.tile svg{width:22px;height:22px;color:#8cc8ff;filter:none}
.opt{grid-template-columns:44px 1fr 22px}
.opt.sel .tile{background:var(--blue-grad)!important;box-shadow:inset 0 0 0 1px rgba(190,225,255,.35)!important}
.opt.sel .tile svg{color:#fff}
.opt.sel{background:rgba(59,130,255,.1);border-color:rgba(120,175,255,.5)}
.opt .ind{border-color:rgba(140,180,255,.3)}
.opt.sel .ind{background:var(--blue-grad);border-color:transparent}
.lrow{grid-template-columns:auto minmax(0,1fr) auto;padding:14px 0}
.info{grid-template-columns:24px minmax(0,1fr)}
.info>svg{width:22px;height:22px;color:#8cc8ff}
/* buttons: futuristic gradient instead of flat */
.btn-primary{background:var(--blue-grad)!important;color:#fff;border:1px solid rgba(170,215,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 24px -10px rgba(60,130,255,.9)!important;text-shadow:0 1px 1px rgba(0,20,80,.35)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -8px rgba(60,140,255,1)!important}
.btn-ghost{background:rgba(59,130,255,.08);border-color:rgba(120,170,255,.22)}
.pill.blue,.phase{background:rgba(59,130,255,.12);color:#9fd0ff;border-color:rgba(120,175,255,.25)}
.bar b,.vtrack b,.mini-prog b,.prog span b,.pv-cap b,.hbar .tr b{background:var(--blue-grad)!important}
.dot.on{background:var(--blue-grad);color:#fff}
.dot.fill{background:rgba(59,130,255,.22)}
.wordmark{background:linear-gradient(180deg,#eaf6ff 0%,#9fd2ff 45%,#3d8bff 100%);-webkit-background-clip:text;background-clip:text}
.t-display{background:linear-gradient(180deg,#f2f8ff 0%,#a8d4ff 100%);-webkit-background-clip:text;background-clip:text}
/* calmer hover on cards (no gradient jump) */
.clickable,.chap{transition:border-color .25s,box-shadow .25s}
.clickable:hover{background:linear-gradient(180deg,rgba(90,140,255,.07),rgba(255,255,255,.02) 50%)!important;border-color:rgba(130,180,255,.32);box-shadow:inset 0 0 0 1px rgba(130,180,255,.08)}
.chap .tsi{transition:transform .25s}
.chap:hover .tsi{transform:scale(1.04)}
.chap{grid-template-columns:64px minmax(0,1fr) auto}
/* readable hexagon labels */
.hex{max-width:340px}
.hex text{font-size:17px;font-weight:500;fill:#9fc4f4}
/* orb usable anywhere */
.orb{display:inline-block;flex:none;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9f4ff 0,var(--pc,#3b82ff) 48%,#06103a 100%);box-shadow:0 0 24px -6px var(--pc,#3b82ff)}
.orb.sm{width:44px;height:44px}
/* app preview concrete rows */
.pv-item{display:flex;align-items:center;gap:6px;width:100%;font-size:8px;color:#cfe0ff;padding:3px 0;border-top:1px solid rgba(140,180,255,.12)}
.pv-item b{min-width:16px;height:14px;padding:0 3px;border-radius:4px;display:grid;place-items:center;font-size:7px;font-weight:600;background:rgba(59,130,255,.25);color:#cfe7ff}

.pico.is-top .tsi-tile{background:var(--blue-grad)!important;box-shadow:inset 0 0 0 .01em rgba(200,230,255,.5),0 0 .5em -.1em rgba(60,140,255,.8)!important;animation:pulse2 3s ease-in-out infinite}
.pico.is-top .cov-ic svg{stroke:#fff}
@keyframes pulse2{50%{box-shadow:inset 0 0 0 .01em rgba(200,230,255,.6),0 0 .8em 0 rgba(60,140,255,.9)}}

/* v12: soft blue light shaft like the render, ribbons behind the tile */
.hero-art .beam-wrap{bottom:71%;height:75vh;width:min(1100px,100vw);-webkit-mask:linear-gradient(180deg,#000 70%,transparent 100%);mask:linear-gradient(180deg,#000 70%,transparent 100%)}
.hero-art .beam-wrap .b1{width:100%;background:radial-gradient(38% 100% at 50% 100%,rgba(30,80,230,.30),rgba(25,65,200,.14) 45%,rgba(20,50,160,.05) 70%,transparent 90%)}
.hero-art .beam-wrap .b2{width:34%;filter:blur(26px);-webkit-mask:none;mask:none;background:linear-gradient(90deg,transparent,rgba(40,100,255,.10) 20%,rgba(50,115,255,.22) 50%,rgba(40,100,255,.10) 80%,transparent),linear-gradient(180deg,transparent,rgba(45,105,255,.18) 50%,rgba(55,120,255,.32));background-blend-mode:normal}
.hero-art .beam-wrap .b3{width:14%;filter:blur(16px);background:linear-gradient(180deg,rgba(60,120,255,0),rgba(70,135,255,.22) 35%,rgba(85,150,255,.45) 80%,rgba(100,165,255,.55))}
.hero-art .beam-wrap .b4{width:5%;height:100%;opacity:1;filter:blur(7px);background:linear-gradient(180deg,rgba(120,175,255,0),rgba(120,175,255,.25) 40%,rgba(150,195,255,.55) 85%,rgba(170,210,255,.7))}
.hero-art .beam-wrap .b5{width:30%;opacity:.35}
.hero-art .beam-wrap::after{content:"";position:absolute;left:50%;bottom:0;width:30%;height:22%;transform:translateX(-50%);background:radial-gradient(50% 100% at 50% 100%,rgba(90,150,255,.35),transparent 75%);filter:blur(8px)}
.hero-art .rib{top:calc(29% - 60px)!important;height:120px!important;z-index:0;-webkit-mask:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)!important;mask:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)!important}
.hero-img{z-index:1}

/* v13: mobile fixes */
html{overflow-x:clip}
body{overflow-x:clip;width:100%}
input,textarea,select{font-size:16px!important}
.gate,.page{max-width:100vw}
.gate{overflow:hidden}
.hub{align-items:stretch}
.hub-hero,.hub .doors{width:100%;margin-inline:auto}
.prog span b{background:linear-gradient(90deg,#1f5cff 0%,#3d8bff 55%,#7cc8ff 100%)!important;background-size:600% 100%!important}
.prog span:nth-child(1) b{background-position:0% 0!important}
.prog span:nth-child(2) b{background-position:20% 0!important}
.prog span:nth-child(3) b{background-position:40% 0!important}
.prog span:nth-child(4) b{background-position:60% 0!important}
.prog span:nth-child(5) b{background-position:80% 0!important}
.prog span:nth-child(6) b{background-position:100% 0!important}

/* v14: rating dots follow the live persona colour */
.dot.on{background:var(--pc)!important;color:#fff;box-shadow:0 0 14px -3px var(--pc)}
.dot.fill{background:color-mix(in srgb,var(--pc) 26%,transparent)!important;color:#dfe9ff}
.persona-live{background:color-mix(in srgb,var(--pc) 16%,transparent)}
.dot,.persona-live,.persona-live i{transition:background .3s,box-shadow .3s,color .2s}
/* ===== v15: info, konfigurátor, nápady ===== */
.glow{position:relative;isolation:isolate;overflow:hidden}
.glow::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(79,140,255,.13),transparent 60%)}
.glow:hover::before{opacity:1}
.xpage{display:flex;flex-direction:column;gap:22px;max-width:960px}
.xhero{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.xlead{font-size:15.5px;max-width:64ch}
.tag-k{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-hi)}
.t-display.sm{font-size:21px}
.xsec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px;padding-top:18px}
.xh{font-family:var(--fd);font-weight:400;font-size:18px;letter-spacing:.02em;color:#dcebff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid2x{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:680px){.grid2x{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.linkb{background:none;border:0;padding:0;color:var(--accent-hi);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(140,200,255,.4)}
.linkb:hover{text-decoration-color:currentColor}
.cta{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:14px;align-items:center;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%;border-color:rgba(120,175,255,.35);background:linear-gradient(135deg,rgba(47,99,240,.18),rgba(47,99,240,.03))}
.cta .chev{width:20px;height:20px;color:var(--accent-hi)}

/* pinned section nav */
.snav-host{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)))}
.snav{padding:10px max(20px,env(safe-area-inset-left,0px));background:rgba(3,5,13,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

function personaOf(sc){

function ribbons(canvas,o={}){
  const ctx=canvas.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0,h=0;const t0=performance.now();
  function size(){const d=Math.min(2,devicePixelRatio||1);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
  function frame(t){
    if(!canvas.isConnected)return;
    if(canvas.clientWidth!==w)size();
    const el=reduce?2:(t-t0)/1000;ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';
    const lines=o.lines||6;const intro=reduce?1:Math.min(1,el/1.4);const ease=1-Math.pow(1-intro,3);
    for(let k=0;k<lines;k++){
      const hue=o.hue!=null?o.hue:218+k*4;
      ctx.beginPath();
      for(let x=0;x<=w;x+=3){
        const u=x/w;const env=Math.pow(Math.sin(Math.PI*u),2.2);
        const talk=.55+.45*Math.sin(el*2.3+k*.7)*Math.sin(el*.9+k);
        const y=h/2+env*h*.38*ease*talk*Math.sin(u*(9+k*1.3)+el*(1.6+k*.25)+k*1.1);
        x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      const a=.5-k*.04;const gr=ctx.createLinearGradient(0,0,w,0);gr.addColorStop(0,`hsla(${hue},100%,${62+k*4}%,0)`);gr.addColorStop(.3,`hsla(${hue},100%,${62+k*4}%,${a})`);gr.addColorStop(.7,`hsla(${hue},100%,${62+k*4}%,${a})`);gr.addColorStop(1,`hsla(${hue},100%,${62+k*4}%,0)`);ctx.strokeStyle=gr;ctx.lineWidth=k===0?2:1.2;
      ctx.shadowColor=`hsla(${hue},100%,60%,.9)`;ctx.shadowBlur=14;ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
    if(!reduce)requestAnimationFrame(frame);
  }
  size();requestAnimationFrame(frame);
}

/* hexagon */
const HX={size:320,c:160,R:104};
function hpt(i,v){const a=-Math.PI/2+i*Math.PI/3;const r=HX.R*v/5;return [HX.c+r*Math.cos(a),HX.c+r*Math.sin(a)]}
function hexGrid(){
  let g='';for(let l=1;l<=5;l++)g+=`<polygon points="${AREAS.map((_,i)=>hpt(i,l).join(',')).join(' ')}" fill="${l===5?'rgba(255,255,255,.025)':'none'}" stroke="rgba(255,255,255,${l===5?.14:.06})"/>`;
  AREAS.forEach((a,i)=>{const [x,y]=hpt(i,5);g+=`<line x1="${HX.c}" y1="${HX.c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`;
    const [lx,ly]=hpt(i,6.3);const anc=Math.abs(lx-HX.c)<4?'middle':lx>HX.c?'start':'end';g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}">${a.short}</text>`});
  return g;
}
function hexStatic(series,cls='hex'){
  let g=hexGrid();
  series.forEach(s=>{g+=`<polygon class="shape" points="${s.v.map((v,i)=>hpt(i,v).join(',')).join(' ')}" fill="${s.fill||'none'}" stroke="${s.stroke}" stroke-width="2" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linejoin="round"/>`;
    if(s.dots)s.v.forEach((v,i)=>{const [x,y]=hpt(i,v);g+=`<circle cx="${x}" cy="${y}" r="4" fill="#fff"/>`})});
  return `<svg class="${cls}" viewBox="-30 0 380 320" role="img" aria-label="Hexagon dovedností">${g}</svg>`;
}
function miniHex(sc,color){let g='';const pts=vals(sc).map((v,i)=>{const a=-Math.PI/2+i*Math.PI/3;const r=24*v/5;return [28+r*Math.cos(a),28+r*Math.sin(a)].join(',')}).join(' ');
  const out=AREAS.map((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return [28+24*Math.cos(a),28+24*Math.sin(a)].join(',')}).join(' ');
  return `<svg class="mini-hex" viewBox="0 0 56 56" aria-hidden="true"><polygon points="${out}" fill="none" stroke="rgba(255,255,255,.12)"/><polygon points="${pts}" fill="${rgba(color,.35)}" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`}

/* interactive hexagon editor + rates */
function hexEditor(host,scores,onChange){
  host.innerHTML=`<div class="hexstep">
     <div class="hexwrap"><svg class="hex live" viewBox="-30 0 380 320" role="img" aria-label="Hexagon dovedností, body lze táhnout">${hexGrid()}<polygon class="shape" points=""/><g class="hds"></g></svg>
       <span class="persona-live"><i></i><span class="pn"></span></span></div>
     <div class="stack" style="gap:8px"><p class="t-cap">1 = brzdí mě, 5 = mám jistotu. Táhni body v hexagonu nebo klikni na číslo.</p>
       <div class="rates">${AREAS.map(a=>`<div class="rate">${ic(a.icon)}<span class="nm">${a.name}</span><div class="dots" role="group" aria-label="${a.name}">${[1,2,3,4,5].map(v=>`<button class="dot" data-a="${a.id}" data-v="${v}" aria-label="${a.name} ${v}">${v}</button>`).join('')}</div></div>`).join('')}</div></div>
   </div>`;
  const svg=host.querySelector('svg.hex');const shape=svg.querySelector('.shape');const hds=svg.querySelector('.hds');
  hds.innerHTML=AREAS.map((a,i)=>`<g class="hd" data-i="${i}"><circle r="18" fill="transparent"/><circle class="k" r="7" fill="#fff" stroke="var(--pc)" stroke-width="3"/></g>`).join('');
  function update(){
    AREAS.forEach(a=>{if(scores[a.id]==null)scores[a.id]=3});
    const p=personaOf(scores);setPC(p.color);
    shape.setAttribute('points',AREAS.map((a,i)=>hpt(i,scores[a.id]).join(',')).join(' '));
    shape.setAttribute('fill',rgba(p.color,.22));shape.setAttribute('stroke',p.color);shape.setAttribute('stroke-width','2');shape.setAttribute('stroke-linejoin','round');
    hds.querySelectorAll('.hd').forEach((g,i)=>{const [x,y]=hpt(i,scores[AREAS[i].id]);g.setAttribute('transform',`translate(${x} ${y})`)});
    host.querySelector('.pn').textContent=p.name;
    host.querySelectorAll('.dot').forEach(b=>{const v=scores[b.dataset.a];const n=+b.dataset.v;b.classList.toggle('on',n===v);b.classList.toggle('fill',n<v)});
  }
  host.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{scores[b.dataset.a]=+b.dataset.v;update();onChange&&onChange()});
  let drag=null;
  function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
  svg.addEventListener('pointerdown',e=>{const p=toSvg(e);const dx=p.x-HX.c,dy=p.y-HX.c;
    let ang=Math.atan2(dy,dx)+Math.PI/2;if(ang<0)ang+=2*Math.PI;const i=Math.round(ang/(Math.PI/3))%6;
    drag=i;svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');move(e);e.preventDefault()});
  function move(e){if(drag==null)return;const p=toSvg(e);const a=-Math.PI/2+drag*Math.PI/3;
    const proj=(p.x-HX.c)*Math.cos(a)+(p.y-HX.c)*Math.sin(a);const v=Math.max(1,Math.min(5,Math.round(proj/HX.R*5)));
    const id=AREAS[drag].id;if(scores[id]!==v){scores[id]=v;update();onChange&&onChange()}}
  svg.addEventListener('pointermove',move);
  const end=()=>{drag=null;svg.classList.remove('dragging')};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  update();
}

function miniQR(seed,size=56){let s='',x0=seed*7+3;const rnd=()=>(x0=(x0*9301+49297)%233280)/233280;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0b1640"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0b1640"/>`;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(rnd()>.52)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0b1640"/>`}
  return `<svg viewBox="-1.5 -1.5 24 24" width="${size}" height="${size}" class="mqr" aria-hidden="true"><rect x="-1.5" y="-1.5" width="24" height="24" rx="3" fill="#fff"/>${s}${f(0,0)}${f(14,0)}${f(0,14)}</svg>`}

  const links=[...host.querySelectorAll('a')];const secs=items.map(([id])=>document.getElementById(id));let pinned=null;
  const setA=id=>links.forEach(a=>{const on=a.dataset.sec===id;a.classList.toggle('active',on);if(on){a.setAttribute('aria-current','true');const n=a.parentElement,l=a.offsetLeft-n.offsetLeft,r=l+a.offsetWidth;if(l<n.scrollLeft)n.scrollLeft=l-8;else if(r>n.scrollLeft+n.clientWidth)n.scrollLeft=r-n.clientWidth+8}else a.removeAttribute('aria-current')});

  const unpin=()=>{pinned=null};['wheel','touchstart','keydown'].forEach(ev=>addEventListener(ev,unpin,{passive:true}));
  const onS=()=>{if(!host.isConnected){removeEventListener('scroll',h);return}if(pinned){setA(pinned);return}

/* sliding segmented switch */
function bindSw(scope,name,value,onChange){
  scope.querySelectorAll(`[data-sw="${name}"]`).forEach(sw=>{
    const btns=[...sw.querySelectorAll('button')];
    const set=v=>{const k=btns.findIndex(b=>b.dataset.v===v);sw.style.setProperty('--i',Math.max(0,k));sw.style.setProperty('--n',btns.length);sw.classList.toggle('none',k<0);btns.forEach((b,j)=>b.setAttribute('aria-pressed',j===k))};
    set(value);btns.forEach(b=>b.onclick=()=>{set(b.dataset.v);onChange(b.dataset.v)});
  });
}

let syncing=null;
async function syncRemote(){if(syncing)return syncing;syncing=(async()=>{try{
  const r=await fetch('/api/konfigurace',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!d||!d.updatedAt)return;
  if(CFG.updatedAt&&d.updatedAt<=CFG.updatedAt)return;
  const keep={};LOCALONLY.forEach(k=>keep[k]=CFG[k]);CFG=Object.assign(CFG0(),d,keep);if(CFG.ideas&&Object.keys(CFG.ideas).some(k=>/^\d+$/.test(k)))CFG.ideas={};
  cfgSave(false);setSaveUI('Načteno');const rt=curRoute();if(rt==='konfigurator')vConfig();else if(rt==='napady')vIdeas();
}catch(e){}finally{syncing=null}})();return syncing}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&['konfigurator','napady'].includes(curRoute()))syncRemote()});
function setSaveUI(t){saveState=t;document.querySelectorAll('.savest').forEach(el=>el.textContent=t)}

function selectedAdds(){const a=[];if(CFG.login==='pass')a.push('pass');['google','pairing','gateway','crm2','videos','workbook','auto','invoices','sellCourse','codes'].forEach(k=>{if(CFG[k])a.push(k)});return a}
function priceOf(){const adds=selectedAdds();const full=BASE+adds.reduce((s,k)=>s+ADDS[k],0);const intro=Math.floor(full*0.8/2000)*2000;
  const weeks=Math.max(4,Math.round(full/62000*6/2)*2);
  let sched;if(CFG.pay==='two'){const h=Math.round(intro/2/100)*100;sched=[['Při startu',h],['Po spuštění',intro-h]]}
  else{const st=Math.round(intro/3/2000)*2000;const m=Math.round((intro-st)/8/100)*100;sched=[['Při startu',st],['Pak 8× měsíčně',m]]}
  return{full,intro,disc:full-intro,adds,weeks,sched,care:CFG.care==='year'?'<s class="strike">9 600</s> 8 000 Kč ročně':'800 Kč měsíčně'}}

function vConfig(){
  root.innerHTML=`<div class="page xpage cfgpage view">
   ${pageTop('<span class="savest">'+(saveState||'')+'</span>')}
   <div class="stepper" id="stepper"></div>
   <div class="cfgl"><main class="cfgmain" id="cfgMain"></main>
     <aside class="cfgsum card" id="cfgSum"></aside></div>
   <div class="mbarsum" id="mSum"></div>
  </div>`;
  cDrawStepper();cDrawStep();cDrawSum();
}
function cDrawStepper(){
  $('#stepper').innerHTML=`<div class="stp-in">${CSTEPS.map((s,i)=>`<button class="stp ${i===CFG.step?'active':''} ${CFG.seen.includes(i)&&i!==CFG.step?'seen':''}" data-step="${i}" ${i===CFG.step?'aria-current="step"':''}><span class="stp-n">${CFG.seen.includes(i)&&i<CFG.step?ic('check'):i===0?ic('spark'):i}</span><span>${s.t}</span></button>`).join('')}</div>
    <div class="stp-bar"><b style="width:${CFG.step/(CSTEPS.length-1)*100}%"></b></div>`;
  const a=$('#stepper .stp.active');if(a){const n=a.parentElement;n.scrollLeft=a.offsetLeft-n.offsetLeft-n.clientWidth/2+a.offsetWidth/2}
}
function cGoStep(i){CFG.step=Math.max(0,Math.min(CSTEPS.length-1,i));if(!CFG.seen.includes(CFG.step))CFG.seen.push(CFG.step);cfgSave(false);cDrawStepper();cDrawStep();cDrawSum();
  const st=$('#stepper');if(st&&st.getBoundingClientRect().top<0)scrollTo({top:st.getBoundingClientRect().top+scrollY-10,behavior:'smooth'})}
function cDrawStep(){
  const s=CSTEPS[CFG.step];const last=CFG.step===CSTEPS.length-1;
  $('#cfgMain').innerHTML=`<div class="stepwrap" key="${s.id}">${CFG.step?`<div class="sthead"><span class="tile">${ic(s.i)}</span><div><p class="t-cap">Krok ${CFG.step} z ${CSTEPS.length-1}</p><h2 class="t-display sm">${s.t}</h2></div></div>`:''}
    ${stepBody(s.id)}
    <div class="stnav">${CFG.step?`<button class="btn btn-ghost" data-step="${CFG.step-1}">${ic('back')}Zpět</button>`:'<span></span>'}${last?'':`<button class="btn btn-primary" data-step="${CFG.step+1}">${CFG.step?'Pokračovat':'Začít'} ${ic('arrow')}</button>`}</div></div>`;
  const m=$('#cfgMain');
  m.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const id=b.dataset.ch;if(id.startsWith('login:'))CFG.login=id.split(':')[1];else CFG[id]=!CFG[id];cfgSave();cDrawStep();cDrawSum()});
  m.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{const t=m.querySelector(`[data-nta="${b.dataset.nt}"]`);t.hidden=!t.hidden;if(!t.hidden)t.focus()});
  m.querySelectorAll('[data-nta]').forEach(t=>t.oninput=()=>{CFG.notes[t.dataset.nta]=t.value;cfgSave()});
  m.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{const g=b.dataset.pc,v=b.dataset.v;const arr=CFG[g];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);const on=arr.includes(v);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=(on?ic('check'):'')+esc(v);cfgSave()});
  m.querySelectorAll('[data-tf]').forEach(t=>t.oninput=()=>{CFG[t.dataset.tf]=t.value;cfgSave()});

function prevApp(){const sc={nerv:3,hlas:4,telo:2,oci:3,pribeh:5,osa:3};
  const pts=vals(sc).map((v,i)=>{const a=-Math.PI/2+i*Math.PI/3,r=34*v/5;return [50+r*Math.cos(a),48+r*Math.sin(a)].join(',')}).join(' ');
  const rings=[1,.66,.33].map(f=>AREAS.map((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return [50+34*f*Math.cos(a),48+34*f*Math.sin(a)].join(',')}).join(' '));
  return `<div class="pv-phone"><div class="pv-top"><span class="pv-dot"></span><span class="pv-l" style="width:46%"></span></div>
   <svg viewBox="0 0 100 96" class="pv-hex">${rings.map(r=>`<polygon points="${r}" fill="none" stroke="rgba(150,190,255,.18)"/>`).join('')}<polygon points="${pts}" fill="rgba(79,140,255,.35)" stroke="#7fb0ff" stroke-width="1.6" stroke-linejoin="round"/></svg>
   <span class="pv-pill"><i></i>Vypravěč</span><span class="pv-item"><b>✓</b>Diagnostika</span><span class="pv-item"><b>12</b>Workshop Základ</span><span class="pv-item"><b>3/7</b>Videokurz</span></div>`}
function prevList(){return `<div class="pv-paper"><div class="pv-ph"><span class="pv-mk"></span>TOP Speaker · Základ</div>
  <p><b>1</b>Proč jsem tady</p><i></i><p><b>2</b>Moje osa</p><div class="pv-axis"><span></span><span></span><span></span></div><p><b>3</b>Co mě stahuje dolů</p><i></i><p><b>4</b>Po workshopu</p><div class="pv-circ">${'<span></span>'.repeat(5)}</div></div>`}
function prevDash(){
  const pts=[18,26,22,34,30,44,40,52];const W=150,H=34;
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-v/60*H).toFixed(1)}`).join(' ');
  const rows=[['Klára','Moderátor','Základ'],['Tomáš','Kotva','Praxe'],['Petra','Objevitel','Základ']];
  return `<div class="pv-win"><div class="pv-wh"><span><b>Základ</b> · 12. 11.</span><span class="pv-badge">6 / 8</span></div>
   <div class="pv-lbl">Přihlášky za 2 týdny</div>
   <svg viewBox="0 0 ${W} ${H+2}" class="pv-spark" preserveAspectRatio="none"><defs><linearGradient id="pvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(92,151,255,.45)"/><stop offset="1" stop-color="rgba(92,151,255,0)"/></linearGradient></defs>
     <path d="${d} L${W},${H+2} L0,${H+2} Z" fill="url(#pvg)"/><path d="${d}" fill="none" stroke="#7fb0ff" stroke-width="1.4"/></svg>
   <div class="pv-rows">${rows.map(r=>`<div class="pv-r"><span class="pv-a">${r[0][0]}</span><span class="pv-n">${r[0]}</span><span class="pv-p">${r[1]}</span><span class="pv-lv">${r[2]}</span></div>`).join('')}</div></div>`}

const STEPS=6;
function optRow(o,sel,radio,attr){return `<button class="opt ${sel?'sel':''}" ${attr} aria-pressed="${sel}"><span class="tile">${ic(o.icon)}</span><span class="tx"><span class="t-strong">${o.t}</span>${o.d?`<br><span class="t-cap">${o.d}</span>`:''}</span><span class="ind ${radio?'radio':''}">${ic('check')}</span></button>`}
function vDiag(){
  mbar('Diagnostika');
  if(S.done&&S.diag.step>=STEPS)return vResult();
  AV().innerHTML=`<div class="stack-l view">
    <div class="prog" id="prog" aria-hidden="true">${Array.from({length:STEPS},()=>'<span><b></b></span>').join('')}</div>
    <div id="stepWrap" class="stack-l"></div>
    <div class="q-nav"><button class="btn btn-ghost" id="prev">${ic('back')}Zpět</button><button class="btn btn-primary" id="next">Pokračovat ${ic('arrow')}</button></div>
  </div>`;
  $('#prev').onclick=()=>{if(S.diag.step>0){S.diag.step--;save();drawStep()}};
  $('#next').onclick=()=>{const d=S.diag;
    if(d.step===STEPS-1){d.step=STEPS;S.done=true;save();vResult();window.scrollTo(0,0);return}
    d.step++;save();drawStep();window.scrollTo({top:0,behavior:'smooth'})};
  drawStep();
}
function okStep(){const d=S.diag;return [d.purpose.length>0,d.where.length>0,d.exp!=null,true,d.drags.length>0,d.goals.length>0||d.note.trim().length>2][d.step]}
function syncNav(){$('#next').disabled=!okStep();$('#prev').style.visibility=S.diag.step>0?'visible':'hidden';
  $('#next').innerHTML=(S.diag.step===STEPS-1?'Zobrazit výsledek ':'Pokračovat ')+ic('arrow');
  document.querySelectorAll('#prog span').forEach((s,i)=>s.classList.toggle('on',i<=S.diag.step))}
function toggle(arr,id){const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id)}
function drawStep(){
  const d=S.diag;const st=Math.min(d.step,STEPS-1);d.step=st;
  const H=(t,s)=>`<div class="stack" style="gap:8px"><p class="t-cap">Krok ${st+1} z ${STEPS}</p><h1 class="t-display">${t}</h1><p class="t-cap">${s}</p></div>`;
  let html='';
  if(st===0)html=H('Proč chceš na komunikaci zapracovat?','Vyber všechno, co sedí.')+`<div class="opts">${PURPOSES.map(o=>optRow(o,d.purpose.includes(o.id),false,`data-m="purpose" data-id="${o.id}"`)).join('')}</div>`;
  if(st===1)html=H('Kde mluvíš nejčastěji?','Vyber všechno, co sedí.')+`<div class="opts">${WHERE.map(o=>optRow(o,d.where.includes(o.id),false,`data-m="where" data-id="${o.id}"`)).join('')}</div>`;
  if(st===2)html=H('Kolik zkušeností s mluvením máš?','Tady vyber jednu. Je to stupnice, ne seznam.')+`<div class="opts">${EXP.map(o=>optRow(o,d.exp===o.id,true,`data-s="exp" data-id="${o.id}"`)).join('')}</div>`;
  if(st===3)html=H('Jak na tom dnes jsi?','Z hexagonu vznikne tvoje persona.')+`<div id="hexHost"></div>`;
  if(st===4)html=H('Co tě nejvíc stahuje dolů?','Vyber všechno, co sedí. Tady uděláš největší skok.')+`<div class="opts two">${DRAGS.map(o=>optRow(o,d.drags.includes(o.id),false,`data-m="drags" data-id="${o.id}"`)).join('')}</div>`;
  if(st===5)html=H('Co si chceš z workshopu odnést?','Vyber všechno, co sedí. Lektor to uvidí předem.')+`<div class="opts two">${GOALS.map(o=>optRow(o,d.goals.includes(o.id),false,`data-m="goals" data-id="${o.id}"`)).join('')}</div>
     <div class="stack" style="gap:8px">${d.note?'':`<button class="addnote" id="addN">${ic('plus')}Přidat vlastní poznámku</button>`}<textarea id="note" placeholder="Např. chci líp vysvětlit klientům hodnotu své práce…" ${d.note?'':'hidden'}>${esc(d.note)}</textarea></div>`;
  const wrap=$('#stepWrap');wrap.innerHTML=`<div class="step-body stack-l">${html}</div>`;
  wrap.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{toggle(d[b.dataset.m],b.dataset.id);const on=d[b.dataset.m].includes(b.dataset.id);b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);save();syncNav()});
  wrap.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{d.exp=+b.dataset.id;wrap.querySelectorAll('[data-s]').forEach(x=>{const on=+x.dataset.id===d.exp;x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on)});save();syncNav()});
  if(st===3)hexEditor($('#hexHost'),d.scores,save);
  const n=$('#note');if(n){n.oninput=()=>{d.note=n.value;save();syncNav()};const a=$('#addN');if(a)a.onclick=()=>{a.remove();n.hidden=false;n.focus()}}
  syncNav();
}

    ${personaCard(p,'Tvoje persona'+(S.after?' po workshopu':'')+' · level '+lv.name)}
    <div class="card stack" id="hexCard">
      <div class="row between"><p class="t-title">Můj posun</p><span class="t-cap">${S.after?(delta>0?'+'+delta+' bodů':delta===0?'Beze změny':delta+' bodů'):'Zatím jen před workshopem'}</span></div>
      <div style="display:grid;place-items:center">${hexStatic(series)}</div>
      <div class="row" style="justify-content:center;gap:18px"><span class="t-cap"><svg width="18" height="4" style="vertical-align:middle;margin-right:6px"><line x1="0" y1="2" x2="18" y2="2" stroke="${S.after?'#56689a':p.color}" stroke-width="2" ${S.after?'stroke-dasharray="4 3"':''}/></svg>Před workshopem</span>${S.after?`<span class="t-cap"><svg width="18" height="4" style="vertical-align:middle;margin-right:6px"><line x1="0" y1="2" x2="18" y2="2" stroke="${p.color}" stroke-width="2"/></svg>Po workshopu</span>`:''}</div>
      <button class="btn btn-ghost" id="rateAfter" style="align-self:center">${ic('pen')}${S.after?'Upravit hodnocení po workshopu':'Ohodnotit se po workshopu'}</button>
    </div>
    <div class="dgrid">
      <div class="card stack"><p class="t-title">Moje workshopy</p>${[...regd,...attended].map(w=>`<button class="lrow" data-go="app-workshop-${w.id}">${wsDate(w)}<div><p class="t-strong">${w.title}</p><p class="t-cap">${w.past?'Absolvováno':'Přihlášeno'} · ${w.date}</p></div>${ic('chev','class="chev"')}</button>`).join('')||'<p class="t-cap">Zatím žádné.</p>'}</div>
      <div class="card stack"><div class="row between"><p class="t-title">Videokurz</p><span class="t-cap">${S.chDone.length} ze 7 kapitol</span></div><div class="bar"><b style="width:${S.chDone.length/7*100}%"></b></div>
        ${S.traits.length?`<p class="t-cap">Chci mít</p><div class="row">${S.traits.map(t=>`<span class="pill blue">${esc(t)}</span>`).join('')}</div>`:''}</div>
    </div>
    <div class="card stack"><p class="t-title">Moje odpovědi</p>
      ${answered.length?`<div>${answered.map(x=>`<div class="info">${ic(x.c.icon)}<div class="stack" style="gap:8px"><p class="t-strong">${x.c.n}. ${x.c.title}</p>${x.items.map(i=>`<div><p class="t-cap">${esc(i.q)}</p><p>${esc(i.a)}</p></div>`).join('')}</div></div>`).join('')}</div>`
      :`<p class="t-cap">Odpovědi z cvičení se ti uloží sem.</p><button class="addnote" data-go="app-kurz">${ic('play')}Otevřít videokurz</button>`}</div>
    <div class="row" id="resetBox"><button class="btn btn-ghost" id="reset">${ic('refresh')}Smazat data a začít znovu</button></div>
  </div>`;
  $('#rateAfter').onclick=()=>{if(!S.after)S.after=Object.assign({},before);const card=$('#hexCard');
    card.innerHTML=`<div class="row between"><p class="t-title">Jak jsi na tom po workshopu?</p></div><div id="afterHost"></div><button class="btn btn-primary" id="saveAfter" style="align-self:flex-start">${ic('check')}Uložit</button>`;
    hexEditor($('#afterHost'),S.after,save);$('#saveAfter').onclick=()=>{save();toast('Uloženo');vProfil()}};
  $('#reset').onclick=()=>{$('#resetBox').innerHTML=`<span class="t-cap">Opravdu smazat všechno?</span><button class="btn btn-ghost" id="no">Ne</button><button class="btn btn-primary" id="yes">Smazat</button>`;
    $('#no').onclick=vProfil;$('#yes').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();setPC('#4f8cff');toast('Smazáno');go('app')}};
}

render();
})();
</script>

</body>
</html>
